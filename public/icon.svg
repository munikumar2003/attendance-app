<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle / icon canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner calendar & checkmark illustration within 80% safe zone (center 410px) -->
  <g filter="url(#shadow)" transform="translate(36, 36)">
    <!-- Calendar Sheet -->
    <rect x="50" y="70" width="340" height="320" rx="36" fill="#FFFFFF" />
    <!-- Calendar Header Stripe -->
    <path d="M 50 106 C 50 86.118 66.118 70 86 70 L 354 70 C 373.882 70 390 86.118 390 106 L 390 150 L 50 150 Z" fill="#10B981" />
    <!-- Calendar Rings/Hangers -->
    <rect x="110" y="44" width="24" height="48" rx="12" fill="#047857" />
    <rect x="306" y="44" width="24" height="48" rx="12" fill="#047857" />
    
    <!-- Attendance grid dots inside calendar -->
    <circle cx="120" cy="200" r="16" fill="#10B981" />
    <circle cx="180" cy="200" r="16" fill="#10B981" />
    <circle cx="240" cy="200" r="16" fill="#F43F5E" />
    <circle cx="300" cy="200" r="16" fill="#10B981" />

    <circle cx="120" cy="256" r="16" fill="#10B981" />
    <circle cx="180" cy="256" r="16" fill="#10B981" />
    <circle cx="240" cy="256" r="16" fill="#10B981" />
    <circle cx="300" cy="256" r="16" fill="#10B981" />

    <!-- Big Prominent Checkmark Badge on bottom right -->
    <circle cx="330" cy="330" r="64" fill="#059669" stroke="#FFFFFF" stroke-width="8" />
    <path d="M 306 332 L 322 348 L 356 312" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
